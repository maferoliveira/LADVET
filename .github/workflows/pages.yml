name: Publicar LADVET

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v6

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Montar site
        run: |
          mkdir site
          cp web/html/index.html site/
          cp -r web/css site/css
          cp -r web/js site/js
          cp -r web/img site/img

      - name: Enviar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
