name: Publicar LADVET

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar pasta web
        uses: actions/upload-pages-artifact@v4
        with:
          path: './web'

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
