<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <link rel="stylesheet" href="../css/login.css">
</head>

<body>

  <button class="voltar" onclick="voltarIdentificacao()">↩</button>

  <img src="../img/Logo.png" class="logo">

  <div class="container">

    <div class="card">

      <div class="card-top">
        <h2>Criar Conta</h2>
      </div>

      <form class="card-body" onsubmit="entrarSistema(event)">

        <input 
          type="text" 
          placeholder="Nome completo"
          required
        >

        <input 
          type="email" 
          placeholder="Email"
          required
        >

        <input 
          type="text" 
          placeholder="Telefone"
          required
        >

        <input 
          type="text" 
          placeholder="Cidade"
          required
        >

        <input 
          type="password" 
          placeholder="Crie uma senha"
          required
        >

        <button 
          type="submit"
          class="btn-acessar">
          Acessar
        </button>

      </form>

    </div>

  </div>

  <script src="../js/script.js"></script>

</body>
</html>
