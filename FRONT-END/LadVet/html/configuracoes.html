<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Configurações
</title>

<link
rel="stylesheet"
href="../css/configuracoes.css">

<script
src="../js/script.js"
defer>
</script>

</head>

<body>

<div class="container">

<button
class="voltar"
onclick="history.back()">

↩

</button>


<h1>

Configurações da conta

</h1>


<div class="foto">

<img
src="../img/userrosa.png"
id="preview">

</div>


<input
type="file"
onchange="trocarFoto(event)">



<input
id="nome"
placeholder="Nome completo">


<input
id="email"
placeholder="Email">


<input
id="telefone"
placeholder="Telefone">


<input
type="password"
id="senha"
placeholder="Nova senha">



<button
class="salvar"
onclick="salvarConfiguracoes()">

Salvar alterações

</button>

</div>

</body>

</html>
