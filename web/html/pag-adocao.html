<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Animais para adoção</title>

    <link
        rel="stylesheet"
        href="../css/pag-adocao.css"
    >
</head>

<body>

    <header class="topo">

        <div class="lado-esquerdo">

            <button
                class="voltar"
                onclick="sair()"
                type="button"
                title="Sair"
            >
                ↩
            </button>

            <button
                class="perfil"
                onclick="abrirPerfil()"
                type="button"
                title="Meu perfil"
            >
                <img
                    src="../img/user.png"
                    alt="Perfil"
                >
            </button>

            <button
                id="novoAnimal"
                class="novo-animal"
                onclick="abrirCadastroAnimal()"
                type="button"
            >
                ＋ Novo animal
            </button>

        </div>

        <img
            src="../img/Logo.png"
            class="logo"
            alt="LADVET"
        >

    </header>


    <main class="container">

        <div class="titulo">

            <h1>Animais</h1>

            <p id="textoPagina">
                Encontre um animal para adoção
            </p>

        </div>


        <section
            class="lista"
            id="listaPets"
        >
            <p>Carregando animais...</p>
        </section>

    </main>


    <script src="../js/script.js"></script>

    <script src="../js/pag-adocao.js"></script>

</body>

</html>
