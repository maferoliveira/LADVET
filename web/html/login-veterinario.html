<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Clínica</title>
    <link rel="stylesheet" href="../css/login-veterinario.css">
</head>

<body>

    <button class="voltar" onclick="voltarIdentificacao()">
        ↩
    </button>

    <img src="../img/Logo.png" class="logo" alt="Logo">

    <div class="container">
        <div class="card">
            <div class="card-top">
                <h2>Login - Clínica</h2>
                <p>Entre na sua conta da clínica</p>
            </div>

            <form class="card-body" onsubmit="entrarVeterinario(event)">
                <input type="email" id="emailVeterinario" placeholder="Email" required>
                <input type="password" id="senhaVeterinario" placeholder="Senha" required>

                <button type="submit" class="btn-acessar">
                    Acessar
                </button>

                <button type="button" class="btn-criar" onclick="irParaCadastroVeterinario()">
                    Criar conta
                </button>

                <div class="separador-google" style="color: #fff">
                    <span>ou</span>
                </div>

                <div id="googleLoginButton" class="google-login-area"></div>
            </form>

            <!-- Elemento movido para fora do formulário para manter a estrutura correta -->
            <div id="formularioGoogle"></div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="../js/script.js"></script>
    <script src="../js/login-google.js" defer></script>

</body>

</html>
