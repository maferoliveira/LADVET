<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Login Clínica
    </title>

    <link rel="stylesheet" href="../css/login-veterinario.css">

</head>

<body>

    <button class="voltar" onclick="voltarIdentificacao()">

        ↩

    </button>


    <img src="../img/Logo.png" class="logo">


    <div class="container">

        <div class="card">

            <div class="card-top">

                <h2>
                    Login - Clínica
                </h2>

            </div>


            <form class="card-body" onsubmit="entrarVeterinario(event)">

                <input type="email" placeholder="Email" required>

                <input type="password" placeholder="Senha" required>

                <button type="submit" class="btn-acessar">

                    Acessar

                </button>

            </form>

        </div>

    </div>


    <script src="../js/script.js">
    </script>

</body>

</html>
