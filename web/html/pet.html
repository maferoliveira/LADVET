<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pet</title>

    <link
        rel="stylesheet"
        href="../css/pet.css"
    >

</head>


<body>

    <!-- =========================
         TOPO
    ========================== -->

    <div class="topo">

        <button
            class="voltar"
            onclick="history.back()"
        >
            ↩
        </button>

        <img
            src="../img/Logo.png"
            class="logo"
            alt="LADVET"
        >

    </div>


    <!-- =========================
         CONTEÚDO DO PET
    ========================== -->

    <div class="container">

        <img
            id="fotoPet"
            alt="Foto do pet"
        >


        <div class="conteudo">


            <!-- =========================
                 INFORMAÇÕES PRINCIPAIS
            ========================== -->

            <div class="top-info">

                <div class="textos">

                    <div id="nomePet"></div>

                    <div id="idadePet"></div>

                    <div id="especiePet"></div>

                </div>


                <!-- FAVORITO
                     O pet.js esconde para veterinário -->

                <div
                    class="favorito"
                    onclick="favoritarPet(this)"
                >
                    ♡
                </div>

            </div>


            <hr>


            <!-- =========================
                 INFORMAÇÕES DO PET
            ========================== -->

            <p id="sexoPet"></p>

            <p id="vacinaPet"></p>

            <p id="temperamentoPet"></p>

            <p id="descricaoPet"></p>


            <div class="divisor"></div>


            <!-- =========================
                 STATUS
            ========================== -->

            <p
                class="status"
                id="statusPet"
            ></p>


            <!-- =========================
                 CARTEIRA DE VACINAÇÃO
            ========================== -->

            <div
                class="carteira"
                id="carteiraVacinas"
            >

                <!--
                    O conteúdo da carteira é criado
                    automaticamente pelo pet.js.

                    Veterinário:
                    - visualiza
                    - pode editar

                    Adotante:
                    - somente visualiza
                -->

            </div>


        </div>


        <!-- =========================
             SOLICITAR ADOÇÃO
        ========================== -->

        <button
            class="adotar"
        >
            Solicitar adoção
        </button>


    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="../js/script.js"></script>
<script src="../js/pet.js"></script>

</body>

</html>
