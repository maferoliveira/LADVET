                </div>

            </div>

            <p id="sexoPet"></p>

            <p id="vacinaPet"></p>

            <p id="temperamentoPet"></p>

            <p id="statusPet"></p>


           <div class="divisor"></div>


<p class="status" id="statusPet">

</p>

        </div>


       <button class="adotar" onclick="solicitarAdocao()">

</button>
