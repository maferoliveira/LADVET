<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animal</title>

    <link rel="stylesheet" href="../css/pet.css">

</head>

<body>

    <main class="container">

                <img id="fotoPet" src="../img/user.png" alt="Foto do animal">

            </div>


            <div class="informacoes-pet">

                <h1 id="nomePet">
                    Carregando...
                </h1>

                <p id="idadePet"></p>

                <p id="especiePet"></p>

                <p id="sexoPet"></p>

                <p id="temperamentoPet"></p>

                <p id="statusPet"></p>


                <p id="descricaoPet"></p>


                <button class="adotar" type="button">
                    Solicitar adoção
                </button>
                <button class="adotar" type="button">
                    Solicitar adoção
                </button>

            </div>

        </section>


        <section id="carteiraVacinas" class="carteira-vacinas">

            <h3>
                Carteira de vacinação
            </h3>

            <p>
                Carregando...
