<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro</title>

    <link
        rel="stylesheet"
        href="../css/cadastro.css"
    >
</head>

<body>

    <button
        class="voltar"
        onclick="voltarIdentificacao()"
    >
        ↩
    </button>

    <img
        src="../img/Logo.png"
        class="logo"
        alt="LADVET"
    >

    <div class="container">

        <div class="card">

            <div class="card-top">

                <h2>Criar conta</h2>

                <p>
                    Cadastre-se para adotar um animal
                </p>

            </div>

            <form
                class="card-body"
                onsubmit="criarConta(event)"
            >

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome completo"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="tel"
                    id="telefone"
                    placeholder="Telefone"
                    required
                >

                <input
                    type="text"
                    id="cep"
                    placeholder="CEP"
                    onblur="buscarCEP()"
                    required
                >

                <input
                    type="text"
                    id="endereco"
                    placeholder="Endereço"
                    required
                >

                <input
                    type="text"
                    id="cidade"
                    placeholder="Cidade"
                    required
                >

                <input
                    type="text"
                    id="bairro"
                    placeholder="Bairro"
                    required
                >

                <input
                    type="text"
                    id="número"
                    placeholder="Número"
                    required
                >

                <select
                    id="residencia"
                    required
                >
                    <option value="">
                        Tipo de residência
                    </option>

                    <option value="Casa">
                        Casa
                    </option>

                    <option value="Apartamento">
                        Apartamento
                    </option>

                    <option value="Outro">
                        Outro
                    </option>
                </select>

                <input
                    type="text"
                    id="espaco"
                    placeholder="Espaço disponível para o animal"
                    required
                >

                <input
                    type="text"
                    id="experiencia"
                    placeholder="Experiência com animais"
                >

                <input
                    type="text"
                    id="rotina"
                    placeholder="Como é sua rotina?"
                    required
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required
                >

                <button
                    type="submit"
                    class="btn-acessar"
                >
                    Criar conta
                </button>

                <button
                    type="button"
                    class="btn-criar"
                    onclick="voltarIdentificacao()"
                >
                    Voltar
                </button>

            </form>

        </div>

    </div>

    <script src="../js/script.js"></script>

</body>

</html>
