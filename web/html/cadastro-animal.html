<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Cadastro Animal
</title>

<link
rel="stylesheet"
href="../css/cadastro-animal.css">

</head>

<body>


<button
class="voltar"
onclick="history.back()">

↩

</button>


<div class="container">


<div class="card">


<div class="card-top">

Cadastro de novo animal

</div>



<form class="formulario" onsubmit="cadastrarAnimal(event)">

<div class="upload">

<input
type="file"
id="foto"
accept="image/*"
onchange="mostrarPreview(event)">

<label for="foto">

<span id="nomeFoto">
📷 Escolher foto do animal
</span>

<span class="icone">
🖼️
</span>

</label>

</div>


<input
type="text"
id="nome"
placeholder="Nome"
required>


<input
type="number"
id="idade"
placeholder="Idade"
min="0"
required>


<input
type="text"
id="especie"
placeholder="Espécie"
required>

<input
type="text"
id="raca"
placeholder="Raça (opcional)">

<input
type="text"
id="porte"
placeholder="Porte (opcional)">


<label>Sexo</label>

<div class="sexo">

<button
type="button"
id="btnFemea"
onclick="selecionarSexo('Fêmea')">

Fêmea

</button>

<button
type="button"
id="btnMacho"
onclick="selecionarSexo('Macho')">

Macho

</button>

</div>
