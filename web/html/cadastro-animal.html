<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastrar animal</title>

    <link
        rel="stylesheet"
        href="../css/cadastro-animal.css"
    >
</head>

<body>

    <header class="topo">

        <button
            class="voltar"
            onclick="voltarAdocao()"
            type="button"
        >
            ↩
        </button>

        <img
            src="../img/Logo.png"
            class="logo"
            alt="LADVET"
        >

    </header>


    <main class="container">

        <div class="card">

            <h1>Cadastrar novo animal</h1>

            <form onsubmit="cadastrarAnimal(event)">

                <div class="card-body">

                    <div class="campo foto-campo">

                        <label for="foto">
                            Foto
                        </label>

                        <input
                            type="file"
                            id="foto"
                            accept="image/*"
                        >

                    </div>


                    <div class="campo">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Nome do animal"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="idade">
                            Idade
                        </label>

                        <input
                            type="number"
                            id="idade"
                            min="0"
                            placeholder="Idade"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="especie">
                            Espécie
                        </label>

                        <input
                            type="text"
                            id="especie"
                            placeholder="Cachorro, gato..."
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="raca">
                            Raça
                        </label>

                        <input
                            type="text"
                            id="raca"
                            placeholder="Raça"
                        >

                    </div>


                    <div class="campo">

                        <label for="porte">
                            Porte
                        </label>

                        <input
                            type="text"
                            id="porte"
                            placeholder="Pequeno, médio ou grande"
                        >

                    </div>


                    <div class="campo">

                        <label>
                            Sexo
                        </label>

                        <div class="sexo">

                            <button
                                type="button"
                                data-sexo="MACHO"
                                onclick="selecionarSexo('MACHO')"
                            >
                                Macho
                            </button>

                            <button
                                type="button"
                                data-sexo="FEMEA"
                                onclick="selecionarSexo('FEMEA')"
                            >
                                Fêmea
                            </button>

                        </div>

                    </div>


                    <div class="campo">

                        <label for="temperamento">
                            Temperamento
                        </label>

                        <input
                            type="text"
                            id="temperamento"
                            placeholder="Calmo, brincalhão..."
                        >

                    </div>


                    <div class="campo campo-descricao">

                        <label for="descricao">
                            Descrição
                        </label>

                        <textarea
                            id="descricao"
                            placeholder="Informações sobre o animal"
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn-cadastrar"
                    >
                        Cadastrar animal
                    </button>


                    <button
                        type="button"
                        class="btn-voltar"
                        onclick="voltarAdocao()"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </div>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>
