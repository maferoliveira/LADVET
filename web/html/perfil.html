<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu perfil</title>

    <link
        rel="stylesheet"
        href="../css/perfil.css"
    >
</head>

<body>

    <header class="topo">

        <button
            class="voltar"
            onclick="voltarAdocao()"
            type="button"
        >
            ↩
        </button>

        <img
            src="../img/Logo.png"
            class="logo"
            alt="LADVET"
        >

    </header>


    <main class="container">

        <div class="card">

            <h1>Meu perfil</h1>

            <form onsubmit="salvarConfiguracoes(event)">

                <div class="card-body">

                    <div class="campo">
                        <label for="nomePerfil">Nome</label>

                        <input
                            type="text"
                            id="nomePerfil"
                        >
                    </div>


                    <div class="campo">
                        <label for="emailPerfil">Email</label>

                        <input
                            type="email"
                            id="emailPerfil"
                            disabled
                        >
                    </div>


                    <div class="campo">
                        <label for="telefonePerfil">Telefone</label>

                        <input
                            type="tel"
                            id="telefonePerfil"
                        >
                    </div>


                    <div class="campo">
                        <label for="cidadePerfil">Cidade</label>

                        <input
                            type="text"
                            id="cidadePerfil"
                        >
                    </div>


                    <div class="campo">
                        <label for="cepPerfil">CEP</label>

                        <input
                            type="text"
                            id="cepPerfil"
                        >
                    </div>


                    <div class="campo">
                        <label for="enderecoPerfil">Endereço</label>

                        <input
                            type="text"
                            id="enderecoPerfil"
                        >
                    </div>


                    <div class="campo">
                        <label for="bairroPerfil">Bairro</label>

                        <input
                            type="text"
                            id="bairroPerfil"
                        >
                    </div>


                    <div class="campo">
                        <label for="numeroPerfil">Número</label>

                        <input
                            type="text"
                            id="numeroPerfil"
                        >
                    </div>


                    <div class="campo">
                        <label for="residenciaPerfil">Residência</label>

                        <input
                            type="text"
                            id="residenciaPerfil"
                        >
                    </div>


                    <div class="campo">
                        <label for="espacoPerfil">Espaço</label>

                        <input
                            type="text"
                            id="espacoPerfil"
                        >
                    </div>


                    <div class="campo">
                        <label for="rotinaPerfil">Rotina</label>

                        <input
                            type="text"
                            id="rotinaPerfil"
                        >
                    </div>


                    <div
                        class="campo"
                        id="campoCrmv"
                    >

                        <label for="crmvPerfil">CRMV</label>

                        <input
                            type="text"
                            id="crmvPerfil"
                            disabled
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-salvar"
                    >
                        Salvar alterações
                    </button>

                </div>

            </form>


            <div class="acoes-perfil">

                <button
                    type="button"
                    onclick="abrirMinhasSolicitacoes()"
                    id="menuAdotante"
                >
                    Minhas solicitações
                </button>


                <button
                    type="button"
                    onclick="abrirSolicitacoes()"
                    id="menuClinica"
                >
                    Solicitações de adoção
                </button>


                <button
                    type="button"
                    onclick="abrirCadastroAnimal()"
                    id="menuNovoAnimal"
                >
                    Cadastrar animal
                </button>


                <button
                    type="button"
                    onclick="sair()"
                >
                    Sair
                </button>

            </div>

        </div>

    </main>


    <script src="../js/script.js"></script>

    <script src="../js/perfil.js"></script>


    <script>

        const usuario = getUsuario();

        const menuAdotante =
            document.getElementById("menuAdotante");

        const menuClinica =
            document.getElementById("menuClinica");

        const menuNovoAnimal =
            document.getElementById("menuNovoAnimal");

        const campoCrmv =
            document.getElementById("campoCrmv");


        if (
            usuario &&
            usuario.tipo_usuario === "CLINICA"
        ) {

            menuAdotante.style.display = "none";

            menuClinica.style.display = "block";

            menuNovoAnimal.style.display = "block";

            campoCrmv.style.display = "flex";

        } else {

            menuClinica.style.display = "none";

            menuNovoAnimal.style.display = "none";

            campoCrmv.style.display = "none";

        }

    </script>

</body>

</html>
