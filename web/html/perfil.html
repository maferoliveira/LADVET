<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil</title>


<link rel="stylesheet" href="../css/perfil.css">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<script src="../js/script.js" defer></script>


</head>



<body>


<div class="tela">



<!-- TOPO -->

<div class="topo">


<button class="voltar" onclick="history.back()">

<i class="bi bi-arrow-left"></i>

</button>



<button class="sair" onclick="irParaInicio()">

Voltar pro início

</button>


</div>





<!-- FOTO -->

<div class="foto">


<img src="../img/userrosa.png" alt="Perfil">


</div>






<!-- DADOS -->

<div class="usuario">


<h1 id="nomePerfil">

Ederson Pinheiro

</h1>



<p id="tipoPerfil">

Adotante

</p>



</div>





<div class="linha"></div>






<!-- MENU -->

<div class="menu">





<!-- SOMENTE ADOTANTE -->

<div 
class="item"
id="minhasSolicitacoes"
onclick="abrirMinhasSolicitacoes()">


<i class="bi bi-bell-fill"></i>


<span>

Minhas solicitações

</span>


</div>







<!-- SOMENTE VETERINÁRIO -->

<div
class="item"
id="cadastroAnimais"
onclick="abrirCadastroAnimal()">



<i class="bi bi-heart-pulse-fill"></i>



<span>

Cadastro de animais

</span>



</div>





<div
class="item"
id="solicitacoes"
onclick="abrirSolicitacoes()">



<i class="bi bi-clipboard-heart-fill"></i>



<span>

Solicitações de adoção

</span>



</div>









<!-- TODOS -->

<div
class="item"
onclick="abrirConfiguracoes()">



<i class="bi bi-gear-fill"></i>



<span>

Configurações da conta

</span>



</div>






<div
class="item"
onclick="abrirContatos()">



<i class="bi bi-telephone-fill"></i>



<span>

Contatos

</span>



</div>






</div>








<!-- FAVORITOS -->

<div
class="favoritos"
id="areaFavoritos">



<div
class="item"
onclick="abrirFavoritos()">



<i class="bi bi-heart-fill"></i>



<span>

Seus favoritos

</span>



</div>



</div>









<div class="linha"></div>









<!-- HISTÓRIA -->

<div
class="rodape"
id="historia"
onclick="abrirHistoria()">



<div class="item historia">


<img
src="../img/Logo.png"
class="logo">


</div>





<div class="texto">


Clique aqui para conhecer a história do nosso aplicativo!


</div>



</div>






</div>









<script>


window.addEventListener("load", function(){



const tipo =
localStorage.getItem("tipoUsuario");



const nome =
document.getElementById("nomePerfil");



const cargo =
document.getElementById("tipoPerfil");



const cadastro =
document.getElementById("cadastroAnimais");



const solicitacoes =
document.getElementById("solicitacoes");



const minhasSolicitacoes =
document.getElementById("minhasSolicitacoes");



const favoritos =
document.getElementById("areaFavoritos");



const historia =
document.getElementById("historia");






if(tipo === "veterinario"){



nome.innerHTML =
"Mafer Oliveira";



cargo.innerHTML =
"Veterinária";



cadastro.style.display =
"flex";



solicitacoes.style.display =
"flex";



minhasSolicitacoes.style.display =
"none";



favoritos.style.display =
"none";



historia.style.display =
"none";



}

else{



nome.innerHTML =
"Ederson Pinheiro";



cargo.innerHTML =
"Adotante";



cadastro.style.display =
"none";



solicitacoes.style.display =
"none";



minhasSolicitacoes.style.display =
"flex";



favoritos.style.display =
"flex";



historia.style.display =
"flex";



}



});



</script>




</body>

</html>
