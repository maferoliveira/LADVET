<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <button class="voltar" onclick="voltarIdentificacao()"> ↩ </button>
    
    <img src="../img/Logo.png" class="logo" alt="Logo">

    <div class="container">
        <div class="card">
            <div class="card-top">
                <h2>Login</h2>
                <p>Entre na sua conta de adotante</p>
            </div>

            <form class="card-body" onsubmit="entrarSistema(event)">
                <input type="email" id="emailLogin" placeholder="Email" required>
                <input type="password" id="senhaLogin" placeholder="Senha" required>
                
                <button type="submit" class="btn-acessar">Acessar</button>
                <button type="button" class="btn-criar" onclick="irParaCadastro()">Criar conta</button>
                
                <div class="separador-google"><span>ou</span></div>
                
                <div id="googleLoginButton" class="google-login-area"></div>
            </form>

            <!-- Div movida para fora do form (caso precise renderizar algo dinâmico do Google) -->
            <div id="formularioGoogle"></div> 
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="../js/script.js"></script>
    <script src="../js/login-google.js" defer></script>
</body>
</html>
