<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Solicitação de adoção</title>

    <link
        rel="stylesheet"
        href="../css/solicitacao.css"
    >

</head>

<body>

    <header class="topo">

        <button
            class="voltar"
            onclick="voltarAdocao()"
        >
            ↩
        </button>

        <img
            src="../img/Logo.png"
            class="logo"
            alt="LADVET"
        >

    </header>


    <main class="container">

        <div class="card">

            <h1>
                Solicitação de adoção
            </h1>

            <p>
                Preencha as informações para solicitar
                a adoção deste animal.
            </p>


            <form id="formAdocao">


                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Seu nome"
                >


                <label for="idade">
                    Idade
                </label>

                <input
                    type="number"
                    id="idade"
                    placeholder="Sua idade"
                >


                <label for="cidade">
                    Cidade
                </label>

                <input
                    type="text"
                    id="cidade"
                    placeholder="Sua cidade"
                >


                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    placeholder="Seu telefone"
                >


                <label for="moradia">
                    Tipo de moradia
                </label>

                <input
                    type="text"
                    id="moradia"
                    placeholder="Casa, apartamento..."
                    required
                >


                <label for="espaco">
                    Espaço disponível
                </label>

                <input
                    type="text"
                    id="espaco"
                    placeholder="Possui quintal? Descreva o espaço"
                    required
                >


                <label for="experiencia">
                    Experiência com animais
                </label>

                <textarea
                    id="experiencia"
                    placeholder="Conte um pouco sobre sua experiência"
                ></textarea>


                <label for="motivo">
                    Motivo da adoção
                </label>

                <textarea
                    id="motivo"
                    placeholder="Por que deseja adotar?"
                ></textarea>


                <label for="cuidados">
                    Tempo disponível para os cuidados
                </label>

                <textarea
                    id="cuidados"
                    placeholder="Descreva quanto tempo terá disponível"
                    required
                ></textarea>


                <button
                    type="submit"
                    class="btn-enviar"
                >
                    Enviar solicitação
                </button>


                <button
                    type="button"
                    class="btn-voltar"
                    onclick="voltarAdocao()"
                >
                    Cancelar
                </button>

            </form>

        </div>

    </main>


    <script src="../js/script.js"></script>

    <script src="../js/solicitacao.js"></script>

</body>

</html>
