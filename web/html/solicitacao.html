<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Solicitação de adoção</title>

    <link
        rel="stylesheet"
        href="../css/solicitacao.css"
    >

</head>

<body>

    <header class="topo">

        <button
            class="voltar"
            onclick="voltarAdocao()"
            type="button"
        >
            ↩
        </button>

        <img
            src="../img/Logo.png"
            class="logo"
            alt="LADVET"
        >

    </header>


    <main class="container">

        <div class="card">

            <h1>
                Solicitação de adoção
            </h1>

            <p>
                Confira seus dados cadastrados e complete
                as informações desta solicitação.
            </p>


            <div class="dados-cadastro">

                <p>
                    Seus dados pessoais, endereço, residência,
                    espaço e experiência com animais serão
                    utilizados automaticamente a partir do seu cadastro.
                </p>

            </div>


            <form id="formAdocao">

                <label for="motivo">
                    Motivo da adoção
                </label>

                <textarea
                    id="motivo"
                    placeholder="Por que deseja adotar?"
                    required
                ></textarea>


                <label for="cuidados">
                    Tempo disponível para os cuidados
                </label>

                <textarea
                    id="cuidados"
                    placeholder="Descreva quanto tempo terá disponível"
                    required
                ></textarea>


                <button
                    type="submit"
                    class="btn-enviar"
                >
                    Enviar solicitação
                </button>


                <button
                    type="button"
                    class="btn-voltar"
                    onclick="voltarAdocao()"
                >
                    Cancelar
                </button>

            </form>

        </div>

    </main>


    <script src="../js/script.js"></script>

    <script src="../js/solicitacao.js"></script>

</body>

</html>
